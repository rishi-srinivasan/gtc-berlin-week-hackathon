[project]
name = "gtc-berlin-week-hackathon"
version = "0.1.0"
description = "German PII redaction gateway: teacher baseline, eval, distil prep"
requires-python = ">=3.11"
dependencies = [
  "langfuse>=5.0.2",
  "openai>=1",
  "anthropic",
  "datasets",
  "faker",
  "python-dotenv",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
presidio = ["presidio-analyzer", "spacy"]
gliner = ["gliner"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii"]

[tool.pytest.ini_options]
pythonpath = ["src"]
