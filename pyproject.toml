[project]
name = "gtc-berlin-week-hackathon"
version = "0.1.0"
description = "German PII redaction gateway for the distil labs x Langfuse x Runpod hackathon"
requires-python = ">=3.11"
dependencies = [
  "langfuse>=5.0.2",
  "openai>=1",
  "anthropic",
  "datasets",
  "faker",
  "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii"]

[tool.pytest.ini_options]
pythonpath = ["src"]
